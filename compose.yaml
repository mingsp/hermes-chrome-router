services:
  router:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-chrome-router:local
    container_name: hermes-chrome-router
    restart: unless-stopped
    init: true
    network_mode: host
    env_file:
      - .env
    environment:
      HERMES_CHROME_ROUTER_AUDIT_DB: /var/lib/hermes-chrome-router/audit.sqlite3
    user: "${ROUTER_UID:-1000}:${ROUTER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - "${HERMES_CHROME_ROUTER_DATA_DIR:-./data}:/var/lib/hermes-chrome-router:rw"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
